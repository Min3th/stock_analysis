[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cse-capital-goods-screening"
version = "0.1.0"
description = "Traceable quarterly screening pipeline for CSE Capital Goods companies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pydantic>=2.8,<3",
  "pymupdf>=1.24,<2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13,<1", "Pillow>=10,<12"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/cse_screening"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

